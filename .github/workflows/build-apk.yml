name: Build PumpCurveApp APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Show directory structure
        run: |
          find . -type f -name "*.gradle" -o -name "*.properties" | head -20

      - name: Show root build.gradle
        run: cat build.gradle

      - name: Show app/build.gradle
        run: cat app/build.gradle

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace 2>&1
        working-directory: .
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PumpCurveApp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn